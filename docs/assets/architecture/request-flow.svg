<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">화면의 값은 어디에서 오는가</title><desc id="desc">데모 시작 → 기간 선택 → API 조회 → 결과 표시. 서버 호출 실패를 모의 값으로 숨기지 않습니다. 기존 정적 시연은 별도 경로에 남깁니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
<rect x="48" y="47" width="5" height="39" fill="#2563eb"/><text x="72" y="79" font-size="32" font-weight="700">화면의 값은 어디에서 오는가</text>
<rect x="48" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="213" font-size="27" font-weight="700">데모 시작</text><text x="72" y="254" font-size="19" fill="#475569">합성 계정 세션</text><path d="M 286 228 H 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="364" y="213" font-size="27" font-weight="700">기간 선택</text><text x="364" y="254" font-size="19" fill="#475569">기준일·일/주/월</text><path d="M 578 228 H 622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="656" y="213" font-size="27" font-weight="700">API 조회</text><text x="656" y="254" font-size="19" fill="#475569">요약·거래·또래</text><path d="M 870 228 H 914" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="924" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="948" y="213" font-size="27" font-weight="700">결과 표시</text><text x="948" y="254" font-size="19" fill="#475569">성공·자료 없음·오류</text>
<text x="48" y="363" font-size="21" fill="#334155">서버 호출 실패를 모의 값으로 숨기지 않습니다. 기존 정적 시연은 별도 경로에 남깁니다.</text>
</g></svg>
