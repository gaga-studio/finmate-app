<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">화면의 값은 어디에서 오는가</title><desc id="desc">기존 마이 화면 → 데이터 공급 계층 → 시연 원장 또는 API → 같은 카드에 표시. API 연결은 예산 카드와 소비 탑 5입니다. 오류·자료 없음은 별도로 표시합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
<rect x="48" y="47" width="5" height="39" fill="#2563eb"/><text x="72" y="79" font-size="32" font-weight="700">화면의 값은 어디에서 오는가</text>
<rect x="48" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="213" font-size="27" font-weight="700">마이 화면</text><text x="72" y="254" font-size="19" fill="#475569">기존 카드·데이터 공급</text><path d="M 286 228 H 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="364" y="213" font-size="27" font-weight="700">데이터 공급</text><text x="364" y="254" font-size="19" fill="#475569">VITE_API_URL로 선택</text><path d="M 578 228 H 622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="656" y="213" font-size="27" font-weight="700">원장 조회</text><text x="656" y="254" font-size="19" fill="#475569">고정 시연 또는 API</text><path d="M 870 228 H 914" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="924" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="948" y="213" font-size="27" font-weight="700">같은 카드</text><text x="948" y="254" font-size="19" fill="#475569">예산·소비 탑 5</text>
<text x="48" y="363" font-size="21" fill="#334155">API 연결은 예산 카드·소비 탑 5입니다. 오류와 자료 없음은 카드 안에 표시합니다.</text>
</g></svg>
